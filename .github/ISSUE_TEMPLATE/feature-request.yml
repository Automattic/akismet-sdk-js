name: Feature request
description: An idea for something new the SDK could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first. What does your code look like today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the SDK to do?
      description: An API sketch helps, if you have one.
      render: ts
